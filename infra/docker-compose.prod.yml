services:
  api:
    image: ${SERVER_IMAGE:-pairprep-server:latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=384
    env_file:
      - path: ${ENV_FILE:-/opt/pairprep/.env}
        required: false
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEB_DIR:-/opt/pairprep/web}:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
