<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/pairprep-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PairPrep · Collaborative Coding & Interview Preparation</title>
    <meta
      name="description"
      content="A real-time collaborative coding room for you and a partner. Write code together live, run code in disposable sandboxes, and rehearse technical interviews."
    />
    <!-- CANONICAL_AND_OG_URL -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="PairPrep · Collaborative Coding & Interview Preparation"
    />
    <meta
      property="og:description"
      content="A real-time collaborative coding room for you and a partner. Write code together live, run code in disposable sandboxes, and rehearse technical interviews."
    />
    <meta property="og:image" content="__OG_IMAGE_URL__" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="PairPrep · Collaborative Coding & Interview Preparation"
    />
    <meta
      name="twitter:description"
      content="A real-time collaborative coding room for you and a partner. Write code together live, run code in disposable sandboxes, and rehearse technical interviews."
    />
    <meta name="twitter:image" content="__OG_IMAGE_URL__" />

    <!-- Route guards: avoid preloading hero on non-landing routes; add noindex on app routes -->
    <script>
      (function () {
        var path = window.location.pathname;
        if (path === "/" || path === "") {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.imageSrcset =
            "/images/hero-terrain-960w.webp 960w, /images/hero-terrain.webp 1920w";
          link.imageSizes = "100vw";
          link.setAttribute("fetchpriority", "high");
          link.type = "image/webp";
          document.head.appendChild(link);
        } else if (
          path.startsWith("/r/") ||
          path === "/dashboard" ||
          path.startsWith("/dashboard/")
        ) {
          var meta = document.createElement("meta");
          meta.name = "robots";
          meta.content = "noindex, nofollow";
          document.head.appendChild(meta);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
