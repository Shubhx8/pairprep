services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  caddy_data:
  caddy_config:
