name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting (Prettier)
        run: npm run format:check

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Run unit & integration tests (Vitest)
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/pairprep_test"
        run: npm run test

      - name: Build all workspaces
        run: npm run build

  deploy:
    name: Build Container & Deploy to Azure VM
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase repository owner
        id: repo_owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER@L}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/pairprep-server:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/pairprep-server:latest

      - name: Check for Deploy Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.VM_SSH_KEY }}" ]; then
            echo "HAS_SECRETS=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_SECRETS=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VM_SSH_KEY not yet configured in GitHub Secrets. Image was built and pushed to GHCR."
          fi

      - name: Deploy to Azure VM over SSH
        if: steps.check_secrets.outputs.HAS_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST || '52.175.53.13' }}
          username: ${{ secrets.VM_USERNAME || 'azureuser' }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /home/${{ secrets.VM_USERNAME || 'azureuser' }}/pairprep
            git fetch origin main
            git reset --hard origin/main

            # Build all packages including apps/web
            npm install
            npm run build

            # Copy built web dist to /opt/pairprep/web for Caddy to mount read-only
            mkdir -p /opt/pairprep/web
            cp -r apps/web/dist/* /opt/pairprep/web/

            # Determine Docker Compose executable
            if docker compose version >/dev/null 2>&1; then
              DOCKER_COMPOSE="docker compose"
            else
              DOCKER_COMPOSE="docker-compose"
            fi

            # Record current running image tag for rollback
            PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' pairprep-api 2>/dev/null || echo "")

            # Log into GHCR on VM to pull the newly built image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export SERVER_IMAGE="ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/pairprep-server:${{ github.sha }}"
            export SITE_ADDRESS="pairprep-live.eastasia.cloudapp.azure.com"
            export ENV_FILE="/opt/pairprep/.env"
            export WEB_DIR="/opt/pairprep/web"

            # Stop standalone PM2 server if running so port 3000 is managed exclusively by docker compose
            pm2 stop pairprep-backend 2>/dev/null || true

            # Pull image and start caddy + api services via docker compose
            $DOCKER_COMPOSE -f infra/docker-compose.prod.yml pull api
            $DOCKER_COMPOSE -f infra/docker-compose.prod.yml up -d

            # Verification: both https://<SITE_ADDRESS>/healthz and https://<SITE_ADDRESS>/ must return 200
            sleep 5
            HEALTH_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://${SITE_ADDRESS}/healthz || echo "000")
            WEB_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://${SITE_ADDRESS}/ || echo "000")

            if [ "$HEALTH_CODE" != "200" ] || [ "$WEB_CODE" != "200" ]; then
              echo "Smoke check failed (healthz: $HEALTH_CODE, web: $WEB_CODE). Rolling back..."
              if [ -n "$PREV_IMAGE" ]; then
                SERVER_IMAGE="$PREV_IMAGE" $DOCKER_COMPOSE -f infra/docker-compose.prod.yml up -d
              fi
              exit 1
            fi

            echo "One-origin hosting deployment verified successfully: https://${SITE_ADDRESS}/ and /healthz both returned 200."
