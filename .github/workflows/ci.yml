name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting (Prettier)
        run: npm run format:check

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Run unit & integration tests (Vitest)
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/pairprep_test"
        run: npm run test

      - name: Build all workspaces
        run: npm run build

      - name: Upload prebuilt web distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: pairprep-web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx --yes playwright install --with-deps chromium

      - name: Build all workspaces
        run: npm run build

      - name: Run E2E tests
        env:
          PORT: 3001
          MONGODB_URI: "mongodb://127.0.0.1:27017/pairprep_e2e"
          SESSION_SECRET: "test_e2e_secret_at_least_32_chars_long_for_security"
          RATE_LIMIT_MAX: "1000"
        run: npm run test:e2e

  deploy:
    name: Build Container & Deploy to Azure VM
    needs: [verify, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download prebuilt web distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: pairprep-web-dist
          path: apps/web/dist

      - name: Archive prebuilt web distribution
        run: |
          tar -czf pairprep-web-dist-${{ github.sha }}.tar.gz -C apps/web/dist .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase repository owner
        id: repo_owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER@L}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/pairprep-server:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/pairprep-server:latest

      - name: Check for Deploy Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.VM_SSH_KEY }}" ]; then
            echo "HAS_SECRETS=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_SECRETS=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VM_SSH_KEY not yet configured in GitHub Secrets. Image was built and pushed to GHCR."
          fi

      - name: Transfer web distribution archive to Azure VM
        if: steps.check_secrets.outputs.HAS_SECRETS == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST || '52.175.53.13' }}
          username: ${{ secrets.VM_USERNAME || 'azureuser' }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "pairprep-web-dist-${{ github.sha }}.tar.gz"
          target: "/tmp"

      - name: Deploy to Azure VM over SSH
        if: steps.check_secrets.outputs.HAS_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST || '52.175.53.13' }}
          username: ${{ secrets.VM_USERNAME || 'azureuser' }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /home/${{ secrets.VM_USERNAME || 'azureuser' }}/pairprep
            git fetch origin main
            git reset --hard origin/main

            # Determine Docker Compose executable
            if docker compose version >/dev/null 2>&1; then
              DOCKER_COMPOSE="docker compose"
            else
              DOCKER_COMPOSE="docker-compose"
            fi

            # Record running containers and mounts for rollback
            API_CID=$($DOCKER_COMPOSE -f infra/docker-compose.prod.yml ps -q api 2>/dev/null || true)
            if [ -n "$API_CID" ]; then
              PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' "$API_CID" 2>/dev/null || true)
            else
              PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' infra-api-1 2>/dev/null || true)
            fi

            CADDY_CID=$($DOCKER_COMPOSE -f infra/docker-compose.prod.yml ps -q caddy 2>/dev/null || true)
            if [ -n "$CADDY_CID" ]; then
              PREV_WEB_DIR=$(docker inspect --format='{{range .Mounts}}{{if eq .Destination "/srv/web"}}{{.Source}}{{end}}{{end}}' "$CADDY_CID" 2>/dev/null || true)
            fi
            if [ -z "$PREV_WEB_DIR" ]; then
              PREV_WEB_DIR="/opt/pairprep/web"
            fi

            echo "Deployment target: ${{ github.sha }}"
            echo "Previous API image: '$PREV_IMAGE'"
            echo "Previous Web directory: '$PREV_WEB_DIR'"

            # Validate previous deployment references before proceeding
            if [ -z "$PREV_IMAGE" ] || ! docker image inspect "$PREV_IMAGE" >/dev/null 2>&1; then
              echo "Error: Cannot determine or verify previous API image ('$PREV_IMAGE'). Aborting to protect production."
              exit 1
            fi

            if [ -z "$PREV_WEB_DIR" ] || [ ! -d "$PREV_WEB_DIR" ] || [ ! -f "$PREV_WEB_DIR/index.html" ]; then
              echo "Error: Cannot determine or verify previous frontend directory ('$PREV_WEB_DIR'). Aborting to protect production."
              exit 1
            fi

            # Set up guarded rollback handler
            DEPLOYMENT_MUTATED=false

            rollback_handler() {
              ORIG_EXIT=$?
              set +e
              trap - EXIT
              if [ "$DEPLOYMENT_MUTATED" = "true" ] && [ "$ORIG_EXIT" -ne 0 ]; then
                echo "========================================================"
                echo "DEPLOYMENT FAILURE DETECTED (exit code: $ORIG_EXIT)."
                echo "Initiating automatic rollback to previous verified state:"
                echo "  SERVER_IMAGE='$PREV_IMAGE'"
                echo "  WEB_DIR='$PREV_WEB_DIR'"
                echo "========================================================"
                if SERVER_IMAGE="$PREV_IMAGE" WEB_DIR="$PREV_WEB_DIR" $DOCKER_COMPOSE -f infra/docker-compose.prod.yml up -d; then
                  echo "Rollback successfully restored previous containers and mount."
                else
                  echo "CRITICAL ERROR: Rollback command failed to restore previous containers."
                fi
              fi
              exit "$ORIG_EXIT"
            }

            trap rollback_handler EXIT

            # Locate and extract prebuilt frontend release artifact
            ARCHIVE_FILE="pairprep-web-dist-${{ github.sha }}.tar.gz"
            if [ -f "/tmp/$ARCHIVE_FILE" ]; then
              ARCHIVE_PATH="/tmp/$ARCHIVE_FILE"
            elif [ -f "$HOME/$ARCHIVE_FILE" ]; then
              ARCHIVE_PATH="$HOME/$ARCHIVE_FILE"
            else
              ARCHIVE_PATH=$(find /tmp $HOME -maxdepth 2 -name "$ARCHIVE_FILE" 2>/dev/null | head -n 1)
            fi

            if [ -z "$ARCHIVE_PATH" ] || [ ! -f "$ARCHIVE_PATH" ]; then
              echo "Error: Prebuilt web distribution archive not found ($ARCHIVE_FILE)"
              exit 1
            fi

            RELEASE_DIR="/opt/pairprep/releases/${{ github.sha }}"
            if ! mkdir -p "$RELEASE_DIR" 2>/dev/null; then
              sudo mkdir -p "$RELEASE_DIR"
              sudo chown -R $(id -u):$(id -g) "/opt/pairprep/releases"
            fi

            tar -xzf "$ARCHIVE_PATH" -C "$RELEASE_DIR"
            rm -f "$ARCHIVE_PATH"

            if [ ! -f "$RELEASE_DIR/index.html" ]; then
              echo "Error: Validation failed; index.html missing from $RELEASE_DIR"
              rm -rf "$RELEASE_DIR"
              exit 1
            fi

            # Log into GHCR on VM to pull the newly built image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export SERVER_IMAGE="ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/pairprep-server:${{ github.sha }}"
            export SITE_ADDRESS="pairprep-live.eastasia.cloudapp.azure.com"
            export ENV_FILE="/opt/pairprep/.env"
            export WEB_DIR="$RELEASE_DIR"

            # Arm rollback immediately before the first mutating operation
            DEPLOYMENT_MUTATED=true
            echo "Production mutation armed: rollback trap active."

            # Stop standalone PM2 server if running so port 3000 is managed exclusively by docker compose
            pm2 stop pairprep-backend 2>/dev/null || true

            # Pull image and start caddy + api services via docker compose
            $DOCKER_COMPOSE -f infra/docker-compose.prod.yml pull api
            $DOCKER_COMPOSE -f infra/docker-compose.prod.yml up -d

            # Bounded retry smoke checks for /healthz ('db': 'ok') and / (HTTP 200)
            MAX_RETRIES=12
            RETRY_INTERVAL=5
            SMOKE_SUCCESS=false

            for i in $(seq 1 $MAX_RETRIES); do
              echo "Production smoke check attempt $i of $MAX_RETRIES..."
              HEALTH_RESP=$(curl -k -s -w "\n%{http_code}" https://${SITE_ADDRESS}/healthz 2>/dev/null || printf "error\n000\n")
              HEALTH_BODY=$(echo "$HEALTH_RESP" | head -n -1)
              HEALTH_CODE=$(echo "$HEALTH_RESP" | tail -n 1)
              WEB_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://${SITE_ADDRESS}/ 2>/dev/null || echo "000")

              echo "Attempt $i: healthz code=$HEALTH_CODE, web code=$WEB_CODE"
              if [ "$HEALTH_CODE" = "200" ] && [ "$WEB_CODE" = "200" ]; then
                if echo "$HEALTH_BODY" | grep -q '"db"[[:space:]]*:[[:space:]]*"ok"'; then
                  echo "Smoke checks succeeded: https://${SITE_ADDRESS}/ and /healthz both returned 200 with db: ok."
                  SMOKE_SUCCESS=true
                  break
                else
                  echo "Healthz code 200 but db is not ok yet: $HEALTH_BODY"
                fi
              fi
              sleep $RETRY_INTERVAL
            done

            if [ "$SMOKE_SUCCESS" = "true" ]; then
              # Disarm rollback only after successful verification
              DEPLOYMENT_MUTATED=false
              trap - EXIT
              echo "One-origin hosting deployment verified successfully: https://${SITE_ADDRESS}/ and /healthz both returned 200 with db: ok."
            else
              echo "Smoke checks failed after $MAX_RETRIES attempts."
              exit 1
            fi

            echo "One-origin hosting deployment verified successfully: https://${SITE_ADDRESS}/ and /healthz both returned 200 with db: ok."
